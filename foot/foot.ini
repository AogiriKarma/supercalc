# SUPERCALC — thème foot (syntaxe foot 1.28)
# Utilisé par sway via `foot -c ~/.config/supercalc/foot/foot.ini` : ton ~/.config/foot/foot.ini reste intact.

[main]
font=Monofur Nerd Font Mono:size=12,Share Tech Mono:size=11
pad=16x14 center-when-maximized-and-fullscreen
initial-color-theme=dark
dpi-aware=no

[cursor]
style=block
blink=no

[colors-dark]
alpha=0.97
background=05111a
foreground=c6ecf8
cursor=05111a ffb13b
selection-foreground=062230
selection-background=d4f4ff
urls=ffb13b
jump-labels=062230 ffb13b
scrollback-indicator=062230 8fdcf5
search-box-no-match=062230 e5484d
search-box-match=062230 ffb13b

# 0 noir   1 rouge (xana)   2 vert (énergie)   3 jaune (ambre)
# 4 bleu (cadre)   5 magenta (liseré)   6 cyan (holomap)   7 blanc
regular0=0c2733
regular1=e5484d
regular2=5be07c
regular3=ffb13b
regular4=2f86b0
regular5=b79cf0
regular6=8fdcf5
regular7=c6ecf8

bright0=4b7f95
bright1=ff8a8e
bright2=9af7b0
bright3=ffd27a
bright4=6cc6e6
bright5=d4c4ff
bright6=d4f4ff
bright7=eafaff
