# --- window rules ---
for_window [app_id="pavucontrol"] floating enable, resize set 720 520
for_window [app_id="org.pulseaudio.pavucontrol"] floating enable, resize set 720 520
for_window [app_id="foot-flottant"] floating enable, resize set 900 560, move position center
# X11 (XWayland) windows: float dialogs and pop-ups
for_window [shell="xwayland" window_role="pop-up"] floating enable
for_window [shell="xwayland" window_type="dialog"] floating enable
for_window [title="Picture-in-Picture"] floating enable, sticky enable

# Quickshell surfaces are wlr layers, not windows: nothing to set here
