# --- startup ---
# the whole desktop (bar, dock, panels, notifications, lock screen) is a single Quickshell
# instance; it reloads itself whenever a config file changes.
exec $qs

# clipboard history (read by the super + v panel)
exec wl-paste --type text --watch cliphist store
exec wl-paste --type image --watch cliphist store

# automatic idling (toggled from the control panel)
exec $supercalc/scripts/veille demarrer
