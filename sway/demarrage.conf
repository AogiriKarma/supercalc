# --- démarrage ---
# le bureau entier (barre, dock, panneaux, notifications, verrouillage) est une seule instance Quickshell ;
# elle se recharge d'elle-même quand un fichier de la config change.
exec $qs

# historique du presse-papiers (lu par le panneau super + v)
exec wl-paste --type text --watch cliphist store
exec wl-paste --type image --watch cliphist store

# mise en veille automatique (bascule depuis le panneau de contrôle)
exec $supercalc/scripts/veille demarrer
