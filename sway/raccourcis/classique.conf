# The `classique` profile — the muscle memory of illogical-impulse (end-4/dots-hyprland),
# transposed from Hyprland to sway. Only what differs from supercalc is touched; everything else,
# the panels included, is identical.
#
#   terminal       super + T  (super + Return still works, illogical binds both)
#   file manager   super + E  -> the layout toggle moves to super + Shift + B
#   browser        super + W  -> the tabbed layout moves to super + Shift + W
#   floating       super + Alt + Space  (super + Shift + Space still works)
#   move container super + Alt + N  instead of super + Shift + N
#   manual         super + /        power menu  ctrl + alt + delete
#
# Not transposed, for want of a sway equivalent: super + D (maximise, distinct from fullscreen in
# Hyprland) and super + S (the `special` workspace). And super + L stays as focus-right — locking
# keeps super + Escape, since otherwise hjkl navigation would have to be sacrificed.
# Supercomputer shortcuts.
#
# Each `#: category | description [| displayed keys]` line documents the bind that follows it:
# the manual (super + F1) is built from this file, so it is always current. Without a third field,
# the keys are read from the bind line below.
#
# The digits and the `²` key use physical key codes (bindcode): same position on AZERTY and on
# QWERTY, with no need for Shift.

# --- sectors (workspaces) ---
set $s1 "1:foret"
set $s2 "2:montagne"
set $s3 "3:banquise"
set $s4 "4:desert"
set $s5 "5:secteur5"
set $s6 "6"
set $s7 "7"
set $s8 "8"
set $s9 "9"

#: secteurs | aller au secteur | SUPER 1→9
bindcode $mod+10 workspace $s1
bindcode $mod+11 workspace $s2
bindcode $mod+12 workspace $s3
bindcode $mod+13 workspace $s4
bindcode $mod+14 workspace $s5
bindcode $mod+15 workspace $s6
bindcode $mod+16 workspace $s7
bindcode $mod+17 workspace $s8
bindcode $mod+18 workspace $s9
#: secteurs | y envoyer | SUPER MAJ 1→9
bindcode $mod+Alt+10 move container to workspace $s1
bindcode $mod+Alt+11 move container to workspace $s2
bindcode $mod+Alt+12 move container to workspace $s3
bindcode $mod+Alt+13 move container to workspace $s4
bindcode $mod+Alt+14 move container to workspace $s5
bindcode $mod+Alt+15 move container to workspace $s6
bindcode $mod+Alt+16 move container to workspace $s7
bindcode $mod+Alt+17 move container to workspace $s8
bindcode $mod+Alt+18 move container to workspace $s9

#: secteurs | holomap
bindsym $mod+Tab exec $qs ipc call panneaux basculer holomap
#: secteurs | secteur précédent
bindsym $mod+Alt+Tab workspace back_and_forth
#: secteurs | écran suivant
bindsym $mod+o focus output right
#: secteurs | secteur → écran suivant
bindsym $mod+Shift+o move workspace to output right
#: secteurs | aller à l'urgence
bindsym $mod+x [urgent=latest] focus
#: secteurs | scratchpad | SUPER ²
bindcode $mod+49 scratchpad show
#: secteurs | y ranger | SUPER MAJ ²
bindcode $mod+Shift+49 move scratchpad

# --- windows ---
#: fenêtres | terminal
bindsym $mod+Return exec $term
#: fenêtres | terminal (illogical) | SUPER T
bindsym $mod+t exec $term
#: fenêtres | fermer
bindsym $mod+q kill
#: fenêtres | focus | SUPER H J K L
bindsym $mod+h focus left
bindsym $mod+j focus down
bindsym $mod+k focus up
bindsym $mod+l focus right
bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right
#: fenêtres | déplacer | SUPER MAJ H J K L
bindsym $mod+Shift+h move left
bindsym $mod+Shift+j move down
bindsym $mod+Shift+k move up
bindsym $mod+Shift+l move right
bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Down move down
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Right move right
#: fenêtres | plein écran
bindsym $mod+f fullscreen toggle
#: fenêtres | flottante
bindsym $mod+Shift+space floating toggle
#: fenêtres | flottant (illogical) | SUPER ALT ESPACE
bindsym $mod+Alt+space floating toggle
#: fenêtres | scinder h / v
bindsym $mod+b split toggle
#: fenêtres | onglets
bindsym $mod+Shift+w layout tabbed
#: fenêtres | pile
bindsym $mod+s layout stacking
#: fenêtres | mosaïque
bindsym $mod+Shift+b layout toggle split
#: fenêtres | redimensionner
bindsym $mod+r mode "redimensionner"
floating_modifier $mod normal

mode "redimensionner" {
	bindsym h resize shrink width 20px
	bindsym j resize grow height 20px
	bindsym k resize shrink height 20px
	bindsym l resize grow width 20px
	bindsym Left resize shrink width 20px
	bindsym Down resize grow height 20px
	bindsym Up resize shrink height 20px
	bindsym Right resize grow width 20px
	bindsym Return mode "default"
	bindsym Escape mode "default"
}

# --- tools ---
#: outils | recherche
bindsym $mod+d exec $qs ipc call panneaux basculer lanceur
#: outils | calculatrice
bindsym $mod+equal exec $qs ipc call lanceur ouvrir =
#: outils | panneau de contrôle
bindsym $mod+n exec $qs ipc call panneaux basculer panneau
#: outils | presse-papiers
bindsym $mod+v exec $qs ipc call panneaux basculer presse-papiers
#: outils | capture de zone
bindsym Print exec $supercalc/scripts/capture zone
#: outils | capture d'écran
bindsym $mod+Print exec $supercalc/scripts/capture ecran
#: outils | vidéo d'écran
bindsym $mod+Shift+Print exec $supercalc/scripts/capture video
#: outils | pipette couleur
bindsym $mod+c exec $supercalc/scripts/pipette
#: outils | ce manuel
bindsym $mod+F1 exec $qs ipc call panneaux basculer manuel

# --- system ---
#: système | verrouiller
bindsym $mod+Escape exec $qs ipc call session verrouiller
#: système | menu d'énergie
bindsym $mod+Shift+e exec $qs ipc call panneaux basculer power
#: système | réglages
bindsym $mod+comma exec $qs ipc call panneaux basculer reglages
#: système | recharger sway
bindsym $mod+Shift+c reload
#: système | mode silencieux
bindsym $mod+Shift+n exec $qs ipc call notifs basculerSilence
#: système | fermer la notif
bindsym $mod+BackSpace exec $qs ipc call notifs fermerDerniere
#: système | mode jeu
bindsym $mod+g exec $qs ipc call session basculerModeJeu
#: système | clavier fr / us
bindsym $mod+space input type:keyboard xkb_switch_layout next
#: système | volume | VOL− VOL+
bindsym XF86AudioRaiseVolume exec wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindsym XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
#: système | couper le son | MUET
bindsym XF86AudioMute exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
#: système | couper le micro | MICRO
bindsym XF86AudioMicMute exec wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
#: système | luminosité | LUM− LUM+
bindsym XF86MonBrightnessUp exec brightnessctl -c backlight set 5%+ && $qs ipc call osd luminosite
bindsym XF86MonBrightnessDown exec brightnessctl -c backlight set 5%- && $qs ipc call osd luminosite
#: système | lecture / pause | LECTURE
bindsym XF86AudioPlay exec playerctl play-pause
bindsym XF86AudioNext exec playerctl next
bindsym XF86AudioPrev exec playerctl previous

# ---------------- additions of the classique profile ----------------
#: outils | gestionnaire de fichiers | SUPER E
bindsym $mod+e exec $term -e ranger
#: outils | navigateur | SUPER W
bindsym $mod+w exec xdg-open https://
#: système | manuel (illogical) | SUPER /
bindsym $mod+slash exec $qs ipc call panneaux basculer manuel
#: système | menu d'alimentation (illogical) | CTRL ALT SUPPR
bindsym Ctrl+Alt+Delete exec $qs ipc call panneaux basculer power
#: outils | capture de zone (illogical) | SUPER MAJ S
bindsym $mod+Shift+s exec $supercalc/scripts/capture zone
