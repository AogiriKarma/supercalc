# Settings specific to your machine: this file is copied to ~/.config/sway/config.d/local.conf at
# install time and never touched again. Everything here is applied after the supercalc config, so
# it can override it.

# --- keyboard: French then US, switch with super + space ---
input type:keyboard {
	xkb_layout "fr,us"
	repeat_delay 300
	repeat_rate 40
}

# --- touchpad ---
input type:touchpad {
	tap enabled
	natural_scroll enabled
	dwt enabled
}

# --- screens: `swaymsg -t get_outputs` gives the names. Examples to adapt:
# output eDP-1 scale 1.25
# output HDMI-A-1 position 1920 0
# output DP-2 transform 90

# --- main screen (system area, dock): automatic, or chosen in super + , -> Screens

# --- startup applications ---
# exec nm-applet --indicator

# --- shortcuts specific to your machine ---
# A line `#: category | description [| keys]` just before a bind makes it appear in the manual
# (super + F1), exactly like supercalc's own.
# Example, the launcher on a plain tap of Super via keyd
# (/etc/keyd/default.conf: `leftmeta = overload(meta, f13)`; xkb translates that code
# into XF86Tools):
# #: outils | recherche (tape de Super) | SUPER
# bindsym XF86Tools exec $qs ipc call panneaux basculer lanceur
