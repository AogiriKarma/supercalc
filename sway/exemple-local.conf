# Réglages propres à ta machine : ce fichier est copié dans ~/.config/sway/config.d/local.conf
# à l'installation et n'est jamais touché ensuite. Tout ce qui est ici passe après la config
# supercalc, donc peut la surcharger.

# --- clavier : français puis US, bascule avec super + espace ---
input type:keyboard {
	xkb_layout "fr,us"
	repeat_delay 300
	repeat_rate 40
}

# --- pavé tactile ---
input type:touchpad {
	tap enabled
	natural_scroll enabled
	dwt enabled
}

# --- écrans : « swaymsg -t get_outputs » donne les noms. Exemples à adapter :
# output eDP-1 scale 1.25
# output HDMI-A-1 position 1920 0
# output DP-2 transform 90

# --- écran principal (zone système, dock) : automatique, ou à choisir dans super + , → Écrans

# --- applications au démarrage ---
# exec nm-applet --indicator
