# --- apparence des fenêtres (sway ne sait dessiner qu'une barre de titre et une bordure) ---
font pango:Gunship Condensed 9
default_border normal 3
default_floating_border normal 3
titlebar_border_thickness 1
titlebar_padding 10 4
title_align right
hide_edge_borders --i3 none
gaps inner 12
gaps outer 0
smart_gaps off

#                       bordure  fond     texte    indicateur bordure-enfant
client.focused          #bfeefc  #2f86b0  #ffffff  #d4f4ff    #2f86b0
client.focused_inactive #4f93b3  #1c5572  #9fd0e4  #4f93b3    #1c5572
client.focused_tab_title #4f93b3 #1c5572  #9fd0e4
client.unfocused        #4f93b3  #1c5572  #9fd0e4  #4f93b3    #1c5572
client.urgent           #ff8a8e  #9a3035  #ffffff  #ff8a8e    #9a3035
client.placeholder      #16404f  #05111a  #5f93ab  #16404f    #05111a
client.background       #05111a

# --- fond d'écran : une image haute définition, recadrée pour remplir chaque écran ---
output * bg $supercalc/fond/fond.jpg fill #082733

# --- curseur ---
seat * xcursor_theme default 24
